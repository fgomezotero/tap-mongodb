[tool.poetry]
name = "tap-mongodb-v2"
version = "1.0.0"
description = "Singer tap for MongoDB with flexible schema inference"
authors = ["Franklin Gomez <fgomezotero@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
singer-sdk = "^0.53.5"
pymongo = {extras = ["srv"], version = "^4.10.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-mongodb-v2 = "tap_mongodb_v2.tap:TapMongoDB.cli"
